name: EduTrack ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: Edutrack_erp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-test-secret-key
      DB_NAME: Edutrack_erp
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

# CI verification trigger
