name: EduTrack ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: edutrack_erp
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-test-secret-key
      DB_ENGINE: mysql
      DB_NAME: edutrack_erp
      DB_USER: root
      DB_PASSWORD: ""
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Verify CI database configuration
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          db = settings.DATABASES["default"]
          assert db["ENGINE"] == "django.db.backends.mysql"
          assert db["HOST"] == "127.0.0.1"
          assert db["PORT"] == "3306"
          print(f"DJANGO_ENV={os.getenv('DJANGO_ENV')}")
          print(f"DB_ENGINE={db['ENGINE']}")
          print(f"DB_NAME={db['NAME']}")
          print(f"DB_USER={db['USER']}")
          print(f"DB_HOST={db['HOST']}")
          print(f"DB_PORT={db['PORT']}")
          PY

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check migration state
        run: python manage.py showmigrations --plan

      - name: Run tests
        run: python manage.py test

# CI verifies the same database engine used by production: MySQL.
# Migration verification runs before applying migrations.
