name: EduTrack ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edutrack_erp
          POSTGRES_USER: edutrack
          POSTGRES_PASSWORD: edutrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U edutrack -d edutrack_erp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-test-secret-key
      DB_ENGINE: postgresql
      DB_NAME: edutrack_erp
      DB_USER: edutrack
      DB_PASSWORD: edutrack
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSL_REQUIRE: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Verify CI database configuration
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          db = settings.DATABASES["default"]
          assert db["ENGINE"] == "django.db.backends.postgresql"
          assert db["HOST"] == "127.0.0.1"
          assert db["PORT"] == "5432"
          print(f"DJANGO_ENV={os.getenv('DJANGO_ENV')}")
          print(f"DB_ENGINE={db['ENGINE']}")
          print(f"DB_NAME={db['NAME']}")
          print(f"DB_USER={db['USER']}")
          print(f"DB_HOST={db['HOST']}")
          print(f"DB_PORT={db['PORT']}")
          PY

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check migration state
        run: python manage.py showmigrations --plan

      - name: Run tests
        run: python manage.py test
