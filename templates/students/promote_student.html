{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">
                Promote Student
            </h4>
        </div>

        <div class="card-body">

            <div class="mb-4">

                <h5>
                    {{ student.full_name }}
                </h5>

                <p class="text-muted mb-1">
                    Admission Number:
                    <strong>
                        {{ student.admission_number }}
                    </strong>
                </p>

                <p class="text-muted">
                    Current Class:
                    <strong>
                        {{ student.current_class.name|default:"Not Assigned" }}
                    </strong>
                </p>

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label
                        for="next_class"
                        class="form-label"
                    >
                        Promote To
                    </label>

                    <select
                        name="next_class"
                        id="next_class"
                        class="form-select"
                        required
                    >

                        <option value="">
                            -- Select Next Class --
                        </option>

                        {% for school_class in next_classes %}

                            <option
                                value="{{ school_class.pk }}"
                            >
                                {{ school_class.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Promote Student
                    </button>

                    <a
                        href="{% url 'student-list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
