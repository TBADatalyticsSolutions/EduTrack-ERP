{% extends "base.html" %}

{% block title %}
Create New Password
{% endblock %}

{% block page_title %}
Create New Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-success text-white">

                <h4>

                    <i class="bi bi-lock-fill"></i>

                    Create New Password

                </h4>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        class="btn btn-success w-100">

                        Save Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
