{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block page_title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white text-center">

                <h3>
                    <i class="bi bi-key-fill"></i>
                    Reset Password
                </h3>

            </div>

            <div class="card-body">

                <p class="text-muted">

                    Enter your registered email address.

                    We'll send you a password reset link.

                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        <i class="bi bi-envelope-fill"></i>

                        Send Reset Link

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
