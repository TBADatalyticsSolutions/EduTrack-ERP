services:
  - type: web
    name: edutrack-erp
    runtime: python
    plan: free
    region: singapore

    buildCommand: ./build.sh

    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /

    envVars:
      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: DB_NAME
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "3306"