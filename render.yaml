services:
  - type: web
    name: edutrack-erp
    runtime: python
    plan: free
    region: oregon

    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /

    envVars:
      # ==========================================================
      # Django
      # ==========================================================
      - key: DJANGO_ENV
        value: "production"

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Set these manually in Render after the service is created.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

      # ==========================================================
      # PostgreSQL
      # ==========================================================
      - key: DB_ENGINE
        value: "postgresql"

      - key: DB_NAME
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_SSL_REQUIRE
        value: "True"

      - key: DB_CONN_MAX_AGE
        value: "60"

      - key: DB_CONN_HEALTH_CHECKS
        value: "True"